name: test

# 每次 push / PR 自动跑静态检查与单元测试,保证回归网始终被执行。
# 单测零外部依赖(纯函数 + mock + t.TempDir),无需凭证与容器。
on:
  push:
    branches: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # npm 包的 README 是独立维护的精简版,新增命令或主 README 改版时
      # 容易漏改,导致发布出去的包文档缺内容。这条检查以真实命令树为准,
      # 强制两个 README 覆盖同一批命令。
      - name: README sync check
        run: |
          go build -o sail .
          ./scripts/check-readme-sync.sh
