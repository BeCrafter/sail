name: test

# 每次 push / PR 自动跑静态检查与单元测试,保证回归网始终被执行。
# 单测零外部依赖(纯函数 + mock + t.TempDir),无需凭证与容器。
on:
  push:
    branches: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...
